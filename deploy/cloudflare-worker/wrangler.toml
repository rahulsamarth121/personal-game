# Personal Game control-plane edge relay.
#
# The Worker name is intentionally unique (the user's existing
# `zed-relay-test` Worker serves an unrelated, authenticated ZED relay and
# was NOT modified). This is a separate deployment in the same account.
#
# CONTROL_PLANE_ORIGIN (the durable, reachable control-plane hostname the
# relay forwards /personal-game/* to) is deliberately NOT set in this file.
# Configure it as a Worker secret so no origin hostname is committed:
#
#     cd deploy/cloudflare-worker
#     npx wrangler secret put CONTROL_PLANE_ORIGIN
#
# Paste the durable control-plane origin at the prompt. It must be a
# hostname reachable from Cloudflare's network (for example a Cloudflare
# Tunnel hostname in front of the Go control plane) — never localhost.
# Changing the secret rolls out a new Worker version automatically; no
# redeploy is needed. Temporary/ephemeral hostnames (e.g. quick
# trycloudflare.com tunnels) must never be committed here — set them as
# secrets only, and replace them with a durable origin for real use.

name = "personal-game-relay"
main = "worker.js"
compatibility_date = "2025-05-01"

# CONTROL_PLANE_ORIGIN is a secret (wrangler secret put), not a [vars] entry.

# Observability: minimal, never logs Authorization values.
[observability]
enabled = false
